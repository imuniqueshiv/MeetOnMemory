name: Main Branch Validation

on:
  push:
    branches: [main, master]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Create minimal .env for tests
        run: |
          cat <<EOF > server/.env
          NODE_ENV=test
          JWT_SECRET=ci_test_secret
          GEMINI_API_KEY=test_key
          GEMINI_MODEL=gemini-2.5-flash
          PINECONE_API_KEY=test_key
          INDEX_NAME=meeton
          EOF

      - name: Run full backend validation
        run: npm run validate:full --prefix server

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 14

  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Run full frontend validation
        run: npm run validate:full --prefix client

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Create minimal .env for tests
        run: |
          cat <<EOF > server/.env
          NODE_ENV=test
          JWT_SECRET=ci_test_secret
          GEMINI_API_KEY=test_key
          GEMINI_MODEL=gemini-2.5-flash
          PINECONE_API_KEY=test_key
          INDEX_NAME=meeton
          EOF

      - name: Run integration tests
        run: npm run test:integration --prefix server

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Run dependency audits
        run: npm run validate:security
